version: "3.7"

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-sargon}_frontend
    restart: always
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3006:3000"
    networks:
      - app_net

networks:
  app_net:
