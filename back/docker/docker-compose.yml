services:
  backend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-sargon}_backend
    command: >
      sh -c "
        python manage.py runserver 0.0.0.0:8000
        "
    volumes:
      - ../:/code
    ports:
      - "8004:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - app_net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sargon}_redis
    ports:
      - "6391:6379"
    networks:
      - app_net
    restart: always

networks:
  app_net:
