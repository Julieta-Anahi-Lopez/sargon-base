services:
  backend:
    build: .
    container_name: ser_natural_backend
    command: >
      sh -c "
        python manage.py runserver 0.0.0.0:8000
        "
    volumes:
      - ../:/code
    ports:
      - "8004:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - ser_natural_net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ser_natural_redis
    ports:
      - "6391:6379"
    networks:
      - ser_natural_net
    restart: always

networks:
  ser_natural_net: